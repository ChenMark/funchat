name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: funchat
          MYSQL_USER: funchat
          MYSQL_PASSWORD: funchat123
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: funchat
      DB_PASSWORD: funchat123
      DB_NAME: funchat
      JWT_SECRET: test-secret-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
