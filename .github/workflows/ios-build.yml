name: iOS build check

# 说明：
# Windows / Linux 无法编译 iOS（Xcode 仅 macOS），因此用 macos runner 验证。
# 本 workflow 分两段：
#   1) typecheck —— 只要仓库里有 Swift 源码就能跑，现在就能给出「能不能编译」的结论
#   2) xcodebuild —— 需要 .xcodeproj 已提交才会执行（示例工程尚未建，自动跳过）
#
# 注意：typecheck 只做类型/符号检查，不检查 Info.plist 与 Assets 颜色集，
#      那两项需在真机/模拟器运行时验证。

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  typecheck:
    name: Swift typecheck (iOS Simulator SDK)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Typecheck all Swift sources
        run: |
          set -uo pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          TARGET=arm64-apple-ios17.0-simulator
          FILES=$(find ios -name '*.swift' | sort | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "::warning::ios/ 下没有找到 Swift 源文件"
            exit 0
          fi
          echo "Typechecking:"
          echo "$FILES" | tr ' ' '\n'
          # 关键：Actions 给 run 加了 `set -e`，失败的 pipeline 会让本步立刻退出，
          # 导致后面的注解/摘要全都写不出去。这里临时关掉 -e，手动保存退出码。
          set +e
          # shellcheck disable=SC2086
          xcrun swiftc -sdk "$SDK" -target "$TARGET" -typecheck $FILES 2>&1 | tee typecheck.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "swiftc exit code = $STATUS"

          # 把每一行 error 作为 GitHub 注解输出 —— run 页面的 Annotations 区无需登录即可看到
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            if [ "$n" -gt 10 ]; then break; fi
            echo "::error::$line"
          done < <(grep -E ': error:' typecheck.log || true)

          # note / warning 走 notice 通道，便于定位上下文
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            if [ "$n" -gt 10 ]; then break; fi
            echo "::notice::$line"
          done < <(grep -E ': (note|warning):' typecheck.log || true)

          # 兜底：失败但没有 ": error:" 行（例如 SDK 加载失败）时，把原始输出注解出来
          if [ "$STATUS" -ne 0 ] && ! grep -q ': error:' typecheck.log; then
            echo "::error::swiftc 退出码 $STATUS，但未匹配到 ': error:' 行，原始输出最后 10 行："
            tail -n 10 typecheck.log | while IFS= read -r line; do echo "::error::$line"; done
          fi

          # 同时写进 job summary
          {
            echo "## Swift typecheck 结果"
            echo
            echo "- 退出码: \`$STATUS\`"
            echo "- 错误数: \`$(grep -c 'error:' typecheck.log || true)\`"
            echo
            echo '```'
            cat typecheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          if-no-files-found: ignore

  xcodebuild:
    name: Xcode build (needs committed .xcodeproj)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Locate Xcode project
        id: locate
        run: |
          PROJ=$(find ios -maxdepth 4 -name '*.xcodeproj' | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "::notice::仓库中还没有 .xcodeproj，跳过完整构建"
          fi
          echo "proj=${PROJ}" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator
        if: steps.locate.outputs.proj != ''
        run: |
          xcodebuild \
            -project "${{ steps.locate.outputs.proj }}" \
            -scheme FunChat \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
